name: AUTO TRADER Phone Build
on:
  push:
    branches:
      - build/autotrader-spot-phone-test-2026-10-09
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint and build APK
        working-directory: autotrader/android
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: auto-trader-spot-phone-test-apk
          path: autotrader/android/app/build/outputs/apk/debug/app-debug.apk
